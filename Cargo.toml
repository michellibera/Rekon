[workspace]
resolver = "2"
members = ["crates/rekon-core", "crates/rekon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
rekon-core = { path = "crates/rekon-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
globset = "0.4"
wait-timeout = "0.2"
shell-words = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
unicode-width = "0.2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tempfile = "3"
